buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

gradle.projectsEvaluated {
    def nitroModulesProject = findProject(":react-native-nitro-modules")
    def mmkvProject = findProject(":react-native-mmkv")

    if (nitroModulesProject != null && mmkvProject != null) {
        def prepareNitroHeaders = nitroModulesProject.tasks.named("prepareHeaders")

        mmkvProject.tasks.configureEach { task ->
            if (task.name.startsWith("configureCMake")) {
                task.dependsOn(prepareNitroHeaders)
            }
        }
    }
}
